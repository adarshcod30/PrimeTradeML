  <text x="968" y="116" fill="#95D5B2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">SIGNAL METRIC</text>
  <text x="968" y="162" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">0.4991</text>
  <text x="968" y="195" fill="#D8F3DC" font-family="Arial, Helvetica, sans-serif" font-size="22">Sample signal rate</text>
  <text x="968" y="224" fill="#B7E4C7" font-family="Arial, Helvetica, sans-serif" font-size="16">Warm-up rows excluded consistently</text>

  <rect x="700" y="250" width="220" height="160" rx="24" fill="url(#card)" stroke="#40916C"/>
  <text x="728" y="296" fill="#95D5B2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">OBSERVABILITY</text>
