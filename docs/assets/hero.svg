  <text x="728" y="404" fill="#B7E4C7" font-family="Arial, Helvetica, sans-serif" font-size="16">Validation, processing, summary, failures</text>

  <rect x="940" y="250" width="220" height="160" rx="24" fill="url(#card)" stroke="#40916C"/>
  <text x="968" y="296" fill="#95D5B2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">DEPLOYMENT</text>
  <text x="968" y="342" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Docker</text>
  <text x="968" y="375" fill="#D8F3DC" font-family="Arial, Helvetica, sans-serif" font-size="22">Python 3.9 slim image</text>
  <text x="968" y="404" fill="#B7E4C7" font-family="Arial, Helvetica, sans-serif" font-size="16">Verified with exact evaluator commands</text>

