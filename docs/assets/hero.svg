<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="1110" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081C15"/>
      <stop offset="0.5" stop-color="#123524"/>
      <stop offset="1" stop-color="#1B4332"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="270" y2="160" gradientUnits="userSpaceOnUse">
