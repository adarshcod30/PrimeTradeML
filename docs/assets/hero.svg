  <text x="728" y="116" fill="#95D5B2" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">DATASET</text>
  <text x="728" y="162" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">10,000</text>
  <text x="728" y="195" fill="#D8F3DC" font-family="Arial, Helvetica, sans-serif" font-size="22">OHLCV rows processed</text>
  <text x="728" y="224" fill="#B7E4C7" font-family="Arial, Helvetica, sans-serif" font-size="16">Quoted-row CSV format normalized safely</text>

