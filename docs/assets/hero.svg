  </text>

  <rect x="60" y="340" width="182" height="46" rx="23" fill="url(#pill)"/>
  <text x="88" y="369" fill="#081C15" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">docker run --rm</text>
  <rect x="260" y="340" width="176" height="46" rx="23" fill="#0B2419" stroke="#95D5B2" stroke-opacity="0.55"/>
  <text x="295" y="369" fill="#D8F3DC" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">metrics and logs</text>

