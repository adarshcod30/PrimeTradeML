  <text x="728" y="467" fill="#95D5B2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Submission Focus</text>
  <text x="728" y="497" fill="#D8F3DC" font-family="Arial, Helvetica, sans-serif" font-size="20">
