      <stop offset="1" stop-color="#0F2A1F"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="180" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#95D5B2"/>
      <stop offset="1" stop-color="#74C69D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="130" r="150" fill="#2D6A4F" opacity="0.25"/>
  <circle cx="210" cy="490" r="170" fill="#40916C" opacity="0.14"/>
  <rect x="46" y="44" width="240" height="42" rx="21" fill="#0B2419" stroke="#74C69D" stroke-opacity="0.5"/>
  <text x="68" y="70" fill="#D8F3DC" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PrimeTradeML Task 0 Submission</text>

  <text x="60" y="155" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">
    Deterministic Trading Signal
  </text>
  <text x="60" y="215" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700">
