name: Validate PrimeTradeML

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run pipeline tests
        run: pytest tests/test_pipeline.py -q

      - name: Run local pipeline
        run: python run.py --input data.csv --config config.yaml --output metrics.json --log-file run.log

      - name: Build Docker image
        run: docker build -t mlops-task .

      - name: Run Docker image
        run: docker run --rm mlops-task
